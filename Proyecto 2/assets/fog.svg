<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Definiciones de efectos y degradados -->
  <defs>
    <radialGradient id="fogGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E2730" stop-opacity="1" />
      <stop offset="70%" stop-color="#12171D" stop-opacity="1" />
      <stop offset="100%" stop-color="#0A0E12" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="smokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3A47" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#171F26" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Fondo base con viñeta radial para profundidad -->
  <rect width="128" height="128" fill="url(#fogGlow)" />
  <rect x="2" y="2" width="124" height="124" rx="4" fill="none" stroke="#06080A" stroke-width="4" />

  <!-- Capas de humo denso entrelazadas -->
  <path d="M 10 44 C 10 18, 44 14, 62 32 C 78 14, 110 20, 118 44 C 130 58, 124 84, 102 90 H 26 C 4 84, -2 58, 10 44 Z" fill="url(#smokeGrad)" />
  <path d="M 18 96 C 8 74, 36 58, 64 68 C 88 52, 118 62, 122 88 C 130 102, 114 120, 90 118 H 38 C 16 118, 10 106, 18 96 Z" fill="#1B242E" />

  <!-- Volutas y remolinos de bruma con relieve -->
  <path d="M 14 52 Q 42 32 70 54 T 114 46" stroke="#374757" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 22 86 Q 52 70 80 90 T 108 82" stroke="#24303C" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 40 34 Q 64 48 88 30" stroke="#415364" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Partículas mágicas de bruma en suspensión -->
  <circle cx="36" cy="42" r="3" fill="#5A7188" opacity="0.5" />
  <circle cx="94" cy="72" r="4" fill="#4C6074" opacity="0.4" />
  <circle cx="64" cy="102" r="2.5" fill="#5A7188" opacity="0.5" />
  <circle cx="82" cy="26" r="2" fill="#6A839E" opacity="0.6" />

  <!-- Borde interior oscuro de la celda para enmarcar el bloqueo -->
  <rect x="4" y="4" width="120" height="120" rx="2" fill="none" stroke="#080B0E" stroke-width="6" opacity="0.8" />
</svg>