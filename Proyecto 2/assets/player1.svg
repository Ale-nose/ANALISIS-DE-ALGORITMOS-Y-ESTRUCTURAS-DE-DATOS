  <!-- Torso lateral -->
  <rect x="40" y="54" width="38" height="40" rx="10" fill="#8D9CA8" stroke="#222A30" stroke-width="4" />
  <rect x="42" y="56" width="22" height="38" fill="#216B9C" stroke="#222A30" stroke-width="3" />

  <!-- Pluma azul superior -->
