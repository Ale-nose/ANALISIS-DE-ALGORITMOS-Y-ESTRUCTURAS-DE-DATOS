  <rect x="41" y="31" width="6" height="21" rx="2" fill="#222A30" />

  <!-- Escudo redondo lateral -->
  <circle cx="58" cy="76" r="15" fill="#216B9C" stroke="#222A30" stroke-width="4" />
  <circle cx="58" cy="76" r="9.5" fill="none" stroke="#9EACB7" stroke-width="3" />
  <circle cx="58" cy="76" r="5" fill="#DFB126" stroke="#222A30" stroke-width="2.5" />
</svg>