  <path d="M 46 28 Q 58 25 70 28" fill="none" stroke="#CBD5DD" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 36 39 L 66 39 L 66 53 Q 50 58 36 53 Z" fill="#83929E" stroke="#222A30" stroke-width="3" stroke-linejoin="round" />

  <!-- Cruz del visor en perfil izquierdo -->
